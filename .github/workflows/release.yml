name: Release

# Publishes to PyPI via trusted publishing (OIDC) — no API token is stored
# anywhere. PyPI trusts this workflow because of the pending publisher /
# publisher configured at pypi.org: repo + this filename + the `pypi`
# environment below must match exactly.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dists:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build

      - name: Check metadata
        run: python -m pip install twine && python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dists
          path: dist/

  publish:
    name: Publish to PyPI
    needs: dists
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mergesignal
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dists
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # PyPI artifacts are immutable — re-pushing a tag (e.g. after a
          # history rewrite) would otherwise fail on "File already exists".
          skip_existing: true
