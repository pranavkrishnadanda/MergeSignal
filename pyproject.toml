[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mergesignal"
version = "0.2.0"
description = "Pre-merge intelligence: predict conflicts, semantic breakage, cross-PR overlap and merge risk before code lands."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MergeSignal contributors" }]
keywords = ["git", "merge", "conflicts", "static-analysis", "code-review", "tree-sitter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-language-pack>=0.4.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pyjwt[crypto]>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
mergesignal = "mergesignal.cli:app"

[project.urls]
Homepage = "https://github.com/pranavkrishnadanda/MergeSignal"
Source = "https://github.com/pranavkrishnadanda/MergeSignal"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: builds real git repositories on disk (slower)",
    "regression: golden-snapshot corpus tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4", "SIM", "RUF", "BLE"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.coverage.run]
source = ["mergesignal"]
branch = true
